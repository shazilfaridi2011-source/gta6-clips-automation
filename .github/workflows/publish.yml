name: Publish approved Shorts

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours = 8 scheduled attempts/day. GitHub may delay scheduled jobs.
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: gta6-shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Process and publish one approved clip
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLIP_FEED_URL: ${{ secrets.CLIP_FEED_URL }}
        run: python run.py

      - name: Save duplicate-prevention state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update processed clip state"
          git push
